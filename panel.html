<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cotizador Vial Nicoya</title>

<style>
:root{
  --bg-light:#f5f7fa;
  --bg-dark:#0f172a;
  --card-light:rgba(255,255,255,0.6);
  --card-dark:rgba(15,23,42,0.6);
  --text-light:#1e293b;
  --text-dark:#f1f5f9;
  --border-light:rgba(255,255,255,0.4);
  --border-dark:rgba(255,255,255,0.1);
  --accent:#dc2626;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
  transition:0.4s;
}

body.light{
  background:var(--bg-light);
  color:var(--text-light);
}

body.dark{
  background:var(--bg-dark);
  color:var(--text-dark);
}

/* TARJETA PRINCIPAL */

.glass{
  width:100%;
  max-width:400px;
  padding:24px;
  border-radius:20px;
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
  position:relative;
  transition:0.4s;
}

body.light .glass{
  background:var(--card-light);
  border:1px solid var(--border-light);
}

body.dark .glass{
  background:var(--card-dark);
  border:1px solid var(--border-dark);
}

/* SWITCH MODO */

.mode-switch{
  position:absolute;
  top:18px;
  right:18px;
}

.mode-switch input{
  display:none;
}

.slider{
  width:55px;
  height:28px;
  background:#ccc;
  border-radius:50px;
  position:relative;
  cursor:pointer;
  transition:0.3s;
  display:flex;
  align-items:center;
}

.slider:before{
  content:"☀️";
  position:absolute;
  width:24px;
  height:24px;
  border-radius:50%;
  top:2px;
  left:2px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  transition:0.3s;
}

.mode-switch input:checked + .slider{
  background:#222;
}

.mode-switch input:checked + .slider:before{
  transform:translateX(27px);
  content:"🌙";
}

/* TITULO */

h1{
  font-size:20px;
  text-align:center;
  margin:8px 55px 24px 0;
  color:var(--accent);
}

/* LABELS */

label{
  font-size:12px;
  opacity:0.8;
  margin-bottom:6px;
  display:block;
}

/* INPUTS */

input[type=number]{
  width:100%;
  padding:12px;
  margin:0 auto 18px auto;
  display:block;
  border-radius:10px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.7);
  font-size:16px;
  color:#1e293b;
  transition:0.3s;
}

body.dark input[type=number]{
  background:rgba(255,255,255,0.1);
  color:white;
}

input[type=number]::placeholder{
  color:#777;
}

/* SERVICIOS */

.services{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:18px;
}

.service{
  padding:12px 8px;
  border-radius:10px;
  background:rgba(255,255,255,0.35);
  border:2px solid transparent;
  text-align:center;
  cursor:pointer;
  transition:all 0.3s;
  font-size:13px;
}

body.dark .service{
  background:rgba(255,255,255,0.08);
}

.service.active{
  border-color:var(--accent);
  background:rgba(220,38,38,0.15);
}

.service:hover{
  transform:translateY(-1px);
}

/* COMBUSTIBLE */

.fuel-box{
  display:none;
  gap:10px;
  margin-bottom:4px;
}

.fuel-box.show{
  display:grid;
  grid-template-columns:1fr 1fr;
}

/* TOGGLE NOCTURNO */

.toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:4px 0 18px;
  font-size:14px;
}

.switch{
  width:55px;
  height:28px;
  background:#ccc;
  border-radius:50px;
  position:relative;
  cursor:pointer;
  transition:0.3s;
}

.switch.on{
  background:var(--accent);
}

.switch:after{
  content:"";
  width:24px;
  height:24px;
  background:white;
  border-radius:50%;
  position:absolute;
  top:2px;
  left:2px;
  transition:0.3s;
}

.switch.on:after{
  left:29px;
}

/* TOTAL */

.total{
  background:rgba(220,38,38,0.12);
  border:1px solid rgba(220,38,38,0.3);
  border-radius:20px;
  padding:16px;
  text-align:center;
  margin-bottom:18px;
}

.total div:first-child{
  font-size:14px;
  margin-bottom:2px;
}

.total span{
  font-size:32px;
  font-weight:700;
  color:var(--accent);
}

.breakdown{
  font-size:11px;
  opacity:0.7;
  margin-top:7px;
  line-height:1.4;
}

/* BOTON */

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  display:block;
  margin:0 auto;
  transition:0.3s;
}

button:hover{
  opacity:0.9;
  transform:translateY(-1px);
}

button:active{
  transform:translateY(0);
}

/* CELULARES */

@media(max-width:420px){
  .glass{
    padding:20px;
  }

  h1{
    font-size:19px;
  }

  .total span{
    font-size:30px;
  }
}
</style>
</head>

<body class="light">

<div class="glass">

  <!-- MODO CLARO / OSCURO -->
  <label class="mode-switch">
    <input type="checkbox" onclick="toggleMode()">
    <div class="slider"></div>
  </label>

  <h1>Asistencia Vial Nicoya</h1>

  <label>Kilómetros desde Nicoya</label>
  <input type="number" id="km" value="5" min="0">

  <label>Servicio</label>

  <div class="services">

    <div class="service"
         data-fee="4000"
         data-type="fuel">
      ⛽<br>
      Gas<br>
      ₡4,000
    </div>

    <div class="service active"
         data-fee="6000"
         data-type="other">
      🔋<br>
      Jumper<br>
      ₡6,000
    </div>

    <div class="service"
         data-fee="10000"
         data-type="other">
      🛞<br>
      Llanta<br>
      ₡10,000
    </div>

    <div class="service"
         data-fee="14000"
         data-type="other">
      🔑<br>
      Lockout<br>
      ₡14,000
    </div>

  </div>

  <div class="fuel-box" id="fuelBox">

    <div>
      <label>Litros</label>
      <input
        type="number"
        id="litros"
        value="3"
        min="0"
        step="0.5">
    </div>

    <div>
      <label>₡ por Litro</label>
      <input
        type="number"
        id="precioLitro"
        value="750"
        min="0">
    </div>

  </div>

  <div class="toggle">
    <span>Nocturno/Feriado +₡5,000</span>
    <div class="switch" id="night"></div>
  </div>

  <div class="total">

    <div>Total</div>

    <span id="total">₡11,000</span>

    <div class="breakdown" id="breakdown"></div>

  </div>

  <button onclick="copiar()">
    Copiar y enviar WhatsApp
  </button>

</div>

<script>

const BASE = 5000;
const KM_EXTRA = 550;
const NIGHT_FEE = 5000;

let serviceFee = 6000;
let serviceType = "other";
let night = false;


/* SERVICIOS */

document.querySelectorAll('.service').forEach(btn => {

  btn.onclick = () => {

    document
      .querySelectorAll('.service')
      .forEach(b => b.classList.remove('active'));

    btn.classList.add('active');

    serviceFee = parseInt(btn.dataset.fee);

    serviceType = btn.dataset.type;

    document
      .getElementById('fuelBox')
      .classList.toggle('show', serviceType === 'fuel');

    calc();

  }

});


/* NOCTURNO */

document.getElementById('night').onclick = () => {

  night = !night;

  document
    .getElementById('night')
    .classList.toggle('on');

  calc();

};


/* INPUTS */

document.getElementById('km').oninput = calc;
document.getElementById('litros').oninput = calc;
document.getElementById('precioLitro').oninput = calc;


/* CALCULO */

function calc(){

  let km =
    parseInt(document.getElementById('km').value) || 0;

  let extraKm =
    Math.max(0, km - 5) * KM_EXTRA;

  let nightFee =
    night ? NIGHT_FEE : 0;

  let fuelCost = 0;

  if(serviceType === 'fuel'){

    let litros =
      parseFloat(document.getElementById('litros').value) || 0;

    let precio =
      parseFloat(document.getElementById('precioLitro').value) || 0;

    fuelCost = litros * precio;

  }

  let total =
    BASE +
    extraKm +
    serviceFee +
    nightFee +
    fuelCost;

  document.getElementById('total').innerText =
    '₡' + total.toLocaleString('es-CR');


  let desglose =
    `Base 5,000 + KM ${extraKm.toLocaleString('es-CR')} + Servicio ${serviceFee.toLocaleString('es-CR')}`;

  if(nightFee)
    desglose += ` + Nocturno 5,000`;

  if(fuelCost)
    desglose += ` + Combustible ${fuelCost.toLocaleString('es-CR')}`;

  document.getElementById('breakdown').innerText =
    desglose;

}


/* COPIAR */

function copiar(){

  let total =
    document.getElementById('total').innerText;

  let msg =
    `Cotización Asistencia Vial Nicoya\n` +
    `${document.getElementById('breakdown').innerText}\n` +
    `Total: ${total}`;

  navigator.clipboard.writeText(msg);

  alert('Copiado para WhatsApp');

}


/* MODO CLARO / OSCURO */

function toggleMode(){

  document.body.classList.toggle('dark');

  document.body.classList.toggle('light');

}


/* CALCULO INICIAL */

calc();

</script>

</body>
</html>
