<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e31e24">

    <title>Asistencia Vial 50201</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f3f4f6;
            color: #202124;
        }

        .app {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            min-height: 100vh;
            background: #f3f4f6;
            padding-bottom: 30px;
        }

        /* HEADER */
        .header {
            background: #ffffff;
            padding: 22px 20px 18px;
            border-bottom: 1px solid #e5e7eb;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 54px;
            height: 54px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .header-text h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            color: #202124;
        }

        .header-text p {
            margin: 4px 0 0;
            font-size: 13px;
            color: #777;
        }

        /* CONTENT */
        .content {
            padding: 18px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,.06);
            border: 1px solid #e8e8e8;
        }

        .section-title {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 13px;
            color: #252525;
        }

        /* INPUTS */
        .field {
            margin-bottom: 13px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #666;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #d9dce1;
            border-radius: 12px;
            padding: 0 14px;
            font-size: 16px;
            outline: none;
            background: #fafafa;
            color: #202124;
            transition: .2s;
        }

        input:focus {
            border-color: #e31e24;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(227,30,36,.10);
        }

        /* SERVICES */
        .services {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .service {
            position: relative;
            border: 2px solid #e7e7e7;
            background: #fff;
            border-radius: 15px;
            padding: 12px 8px;
            min-height: 126px;
            cursor: pointer;
            text-align: center;
            transition: .18s ease;
        }

        .service:hover {
            border-color: #f0a0a2;
        }

        .service.active {
            border-color: #e31e24;
            background: #fff7f7;
            box-shadow: 0 4px 12px rgba(227,30,36,.10);
        }

        .service img {
            width: 68px;
            height: 68px;
            object-fit: contain;
            display: block;
            margin: 0 auto 5px;
        }

        .service-name {
            font-size: 14px;
            font-weight: 800;
            color: #252525;
        }

        .service-price {
            font-size: 12px;
            color: #777;
            margin-top: 2px;
        }

        .service-check {
            position: absolute;
            top: 7px;
            right: 8px;
            width: 21px;
            height: 21px;
            border-radius: 50%;
            background: #e31e24;
            color: #fff;
            font-size: 13px;
            line-height: 21px;
            display: none;
            font-weight: 900;
        }

        .service.active .service-check {
            display: block;
        }

        /* FUEL */
        .fuel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* TOGGLE */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding-top: 4px;
        }

        .toggle-text {
            font-size: 14px;
            font-weight: 700;
        }

        .toggle {
            position: relative;
            width: 52px;
            height: 30px;
            flex-shrink: 0;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #d5d7da;
            border-radius: 30px;
            transition: .2s;
        }

        .slider:before {
            content: "";
            position: absolute;
            height: 24px;
            width: 24px;
            left: 3px;
            top: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,.2);
            transition: .2s;
        }

        .toggle input:checked + .slider {
            background: #e31e24;
        }

        .toggle input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* TOTAL */
        .total-card {
            background: #202124;
            color: white;
            border-radius: 18px;
            padding: 19px;
            margin-bottom: 16px;
        }

        .total-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .total-label {
            font-size: 13px;
            opacity: .72;
        }

        .total-value {
            font-size: 30px;
            font-weight: 900;
            white-space: nowrap;
        }

        .breakdown {
            margin-top: 13px;
            padding-top: 13px;
            border-top: 1px solid rgba(255,255,255,.14);
            font-size: 12px;
            line-height: 1.65;
            color: rgba(255,255,255,.72);
        }

        /* BUTTON */
        .whatsapp-button {
            width: 100%;
            border: 0;
            border-radius: 14px;
            background: #e31e24;
            color: white;
            min-height: 54px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(227,30,36,.22);
            transition: .18s;
        }

        .whatsapp-button:hover {
            background: #c9181e;
        }

        .whatsapp-button:active {
            transform: scale(.985);
        }

        /* HISTORY */
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .history-header .section-title {
            margin: 0;
        }

        .clear-history {
            border: 0;
            background: transparent;
            color: #e31e24;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            padding: 5px;
        }

        .history-empty {
            font-size: 13px;
            color: #888;
            text-align: center;
            padding: 12px 0 4px;
        }

        .history-item {
            border: 1px solid #e5e5e5;
            border-radius: 13px;
            padding: 13px;
            margin-bottom: 9px;
            background: #fafafa;
        }

        .history-item:last-child {
            margin-bottom: 0;
        }

        .history-main {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .history-name {
            font-size: 14px;
            font-weight: 800;
        }

        .history-vehicle {
            font-size: 12px;
            color: #777;
            margin-top: 3px;
        }

        .history-total {
            font-size: 15px;
            font-weight: 900;
            white-space: nowrap;
            color: #e31e24;
        }

        .history-details {
            margin-top: 9px;
            padding-top: 9px;
            border-top: 1px solid #e5e5e5;
            color: #777;
            font-size: 11px;
            line-height: 1.6;
        }

        .history-actions {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }

        .history-action {
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .history-action.delete {
            color: #e31e24;
        }

        /* DESKTOP */
        @media (min-width: 700px) {
            body {
                padding: 25px 0;
            }

            .app {
                min-height: auto;
                border-radius: 22px;
                overflow: hidden;
                box-shadow: 0 10px 40px rgba(0,0,0,.08);
            }

            .header {
                position: relative;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="header-content">
            <img src="https://www.carbucr.com/images/logoweb.png"
                 alt="CARBU"
                 class="logo">

            <div class="header-text">
                <h1>Asistencia Vial 50201</h1>
                <p>Cotizador de asistencia</p>
            </div>
        </div>
    </header>

    <main class="content">

        <!-- CLIENTE -->
        <section class="card">
            <div class="section-title">Cliente</div>

            <div class="field">
                <label for="name">Nombre</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Nombre del cliente"
                    autocomplete="off">
            </div>

            <div class="field">
                <label for="vehicle">Vehículo</label>
                <input
                    type="text"
                    id="vehicle"
                    placeholder="Vehículo"
                    autocomplete="off">
            </div>
        </section>

        <!-- KILOMETROS -->
        <section class="card">
            <div class="section-title">Kilómetros desde Nicoya</div>

            <div class="field">
                <input
                    type="number"
                    id="km"
                    min="0"
                    step="1"
                    inputmode="numeric"
                    placeholder="0">
            </div>
        </section>

        <!-- SERVICIO -->
        <section class="card">
            <div class="section-title">Servicio</div>

            <div class="services">

                <div class="service"
                     data-service="gas"
                     data-price="5000"
                     onclick="selectService(this)">
                    <div class="service-check">✓</div>
                    <img src="https://www.carbucr.com/images/gas.png"
                         alt="Gas">
                    <div class="service-name">Gas</div>
                    <div class="service-price">₡5,000</div>
                </div>

                <div class="service active"
                     data-service="jumper"
                     data-price="7000"
                     onclick="selectService(this)">
                    <div class="service-check">✓</div>
                    <img src="https://www.carbucr.com/images/corriente.png"
                         alt="Jumper">
                    <div class="service-name">Jumper</div>
                    <div class="service-price">₡7,000</div>
                </div>

                <div class="service"
                     data-service="llanta"
                     data-price="10000"
                     onclick="selectService(this)">
                    <div class="service-check">✓</div>
                    <img src="https://www.carbucr.com/images/llanta.png"
                         alt="Llanta">
                    <div class="service-name">Llanta</div>
                    <div class="service-price">₡10,000</div>
                </div>

                <div class="service"
                     data-service="lockout"
                     data-price="15000"
                     onclick="selectService(this)">
                    <div class="service-check">✓</div>
                    <img src="https://www.carbucr.com/images/cierre.png"
                         alt="Lockout">
                    <div class="service-name">Lockout</div>
                    <div class="service-price">₡15,000</div>
                </div>

            </div>
        </section>

        <!-- COMBUSTIBLE -->
        <section class="card">

            <div class="section-title">Combustible</div>

            <div class="fuel-grid">

                <div class="field">
                    <label for="litros">Litros</label>
                    <input
                        type="number"
                        id="litros"
                        min="0"
                        step="0.1"
                        inputmode="decimal"
                        placeholder="0">
                </div>

                <div class="field">
                    <label for="precioLitro">₡ por Litro</label>
                    <input
                        type="number"
                        id="precioLitro"
                        min="0"
                        step="1"
                        inputmode="numeric"
                        placeholder="0">
                </div>

            </div>

        </section>

        <!-- NOCTURNO -->
        <section class="card">

            <div class="toggle-row">

                <div class="toggle-text">
                    Nocturno/Feriado +₡5,000
                </div>

                <label class="toggle">
                    <input type="checkbox" id="night">
                    <span class="slider"></span>
                </label>

            </div>

        </section>

        <!-- TOTAL -->
        <section class="total-card">

            <div class="total-top">

                <div class="total-label">
                    Total
                </div>

                <div class="total-value" id="total">
                    ₡12,000
                </div>

            </div>

            <div class="breakdown" id="breakdown">
                Base ₡5,000 + KM ₡0 + Servicio ₡7,000
            </div>

        </section>

        <!-- WHATSAPP -->
        <button
            class="whatsapp-button"
            onclick="sendWhatsApp()">
            💬 Enviar cotización por WhatsApp
        </button>

        <!-- HISTORIAL -->
        <section class="card" style="margin-top:16px;">

            <div class="history-header">
                <div class="section-title">Historial</div>

                <button
                    class="clear-history"
                    onclick="clearHistory()">
                    Borrar historial
                </button>
            </div>

            <div id="historyList"></div>

        </section>

    </main>

</div>

<script>
    const BASE = 5000;
    const KM_BASE = 5;
    const KM_PRICE = 550;
    const NIGHT_FEE = 5000;

    let serviceFee = 7000;
    let serviceType = "jumper";

    const kmInput = document.getElementById("km");
    const litrosInput = document.getElementById("litros");
    const precioLitroInput = document.getElementById("precioLitro");
    const nightInput = document.getElementById("night");

    const nameInput = document.getElementById("name");
    const vehicleInput = document.getElementById("vehicle");

    /* Selección de servicio */
    function selectService(element) {
        document.querySelectorAll(".service").forEach(service => {
            service.classList.remove("active");
        });

        element.classList.add("active");

        serviceFee = Number(element.dataset.price);
        serviceType = element.dataset.service;

        calculate();
    }

    /* Cálculo de kilómetros */
    function calculateKm(km) {
        if (km <= KM_BASE) {
            return BASE;
        }
        return Math.max(BASE, km * KM_PRICE);
    }

    /* Cálculo completo */
    function calculate() {
        const km = Math.max(0, Number(kmInput.value) || 0);
        const litros = Math.max(0, Number(litrosInput.value) || 0);
        const precioLitro = Math.max(0, Number(precioLitroInput.value) || 0);

        const kmCost = calculateKm(km);
        const fuelCost = litros * precioLitro;
        const nightFee = nightInput.checked ? NIGHT_FEE : 0;

        const total = kmCost + serviceFee + nightFee + fuelCost;

        document.getElementById("total").textContent = "₡" + total.toLocaleString("es-CR");

        let breakdown = "Base/KM " + kmCost.toLocaleString("es-CR") + " + Servicio " + serviceFee.toLocaleString("es-CR");

        if (km > 0) {
            if (km <= KM_BASE) {
                breakdown = "Base " + kmCost.toLocaleString("es-CR") + " + Servicio " + serviceFee.toLocaleString("es-CR");
            } else {
                breakdown = "KM " + km + " × ₡550 = " + kmCost.toLocaleString("es-CR") + " + Servicio " + serviceFee.toLocaleString("es-CR");
            }
        }

        if (nightFee > 0) {
            breakdown += " + Nocturno " + nightFee.toLocaleString("es-CR");
        }

        if (fuelCost > 0) {
            breakdown += " + Combustible " + fuelCost.toLocaleString("es-CR");
        }

        document.getElementById("breakdown").textContent = breakdown;

        return {
            km,
            kmCost,
            litros,
            precioLitro,
            fuelCost,
            nightFee,
            total
        };
    }

    /* Escuchar cambios */
    [kmInput, litrosInput, precioLitroInput].forEach(input => {
        input.addEventListener("input", calculate);
        input.addEventListener("change", calculate);
    });

    nightInput.addEventListener("change", calculate);
    nameInput.addEventListener("input", calculate);
    vehicleInput.addEventListener("input", calculate);

    /* Historial */
    function getHistory() {
        try {
            return JSON.parse(localStorage.getItem("carbuHistorial") || "[]");
        } catch (error) {
            return [];
        }
    }

    function saveHistory(record) {
        const history = getHistory();
        history.unshift(record);
        const limitedHistory = history.slice(0, 100);

        localStorage.setItem("carbuHistorial", JSON.stringify(limitedHistory));
        renderHistory();
    }

    function renderHistory() {
        const historyList = document.getElementById("historyList");
        const history = getHistory();

        if (history.length === 0) {
            historyList.innerHTML = '<div class="history-empty">No hay servicios guardados.</div>';
            return;
        }

        historyList.innerHTML = history.map((item, index) => {
            const date = new Date(item.date);
            const dateText = date.toLocaleDateString("es-CR") + " " + date.toLocaleTimeString("es-CR", { hour: "2-digit", minute: "2-digit" });

            return `
                <div class="history-item">
                    <div class="history-main">
                        <div>
                            <div class="history-name">${escapeHTML(item.name || "Sin nombre")}</div>
                            <div class="history-vehicle">${escapeHTML(item.vehicle || "Sin vehículo")}</div>
                        </div>
                        <div class="history-total">₡${Number(item.total).toLocaleString("es-CR")}</div>
                    </div>
                    <div class="history-details">
                        ${dateText}<br>
                        ${item.km} km · ${getServiceName(item.serviceType)}
                        ${item.nightFee > 0 ? " · Nocturno/Feriado" : ""}
                        ${item.fuelCost > 0 ? " · Combustible ₡" + Number(item.fuelCost).toLocaleString("es-CR") : ""}
                    </div>
                    <div class="history-actions">
                        <button class="history-action" onclick="loadHistory(${index})">Cargar</button>
                        <button class="history-action delete" onclick="deleteHistory(${index})">Eliminar</button>
                    </div>
                </div>
            `;
        }).join("");
    }

    function getServiceName(type) {
        const names = {
            gas: "Gas",
            jumper: "Jumper",
            llanta: "Llanta",
            lockout: "Lockout"
        };
        return names[type] || "Servicio";
    }

    function escapeHTML(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function loadHistory(index) {
        const history = getHistory();
        const item = history[index];
        if (!item) return;

        nameInput.value = item.name || "";
        vehicleInput.value = item.vehicle || "";
        kmInput.value = item.km || "";
        litrosInput.value = item.litros || "";
        precioLitroInput.value = item.precioLitro || "";
        nightInput.checked = Boolean(item.nightFee);

        document.querySelectorAll(".service").forEach(service => {
            if (service.dataset.service === item.serviceType) {
                selectService(service);
            }
        });

        calculate();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function deleteHistory(index) {
        const history = getHistory();
        history.splice(index, 1);
        localStorage.setItem("carbuHistorial", JSON.stringify(history));
        renderHistory();
    }

    function clearHistory() {
        const history = getHistory();
        if (history.length === 0) return;

        if (confirm("¿Borrar todo el historial?")) {
            localStorage.removeItem("carbuHistorial");
            renderHistory();
        }
    }

    /* WhatsApp */
    function sendWhatsApp() {
        const calculation = calculate();
        const name = nameInput.value.trim();
        const vehicle = vehicleInput.value.trim();

        saveHistory({
            date: new Date().toISOString(),
            name,
            vehicle,
            km: calculation.km,
            litros: calculation.litros,
            precioLitro: calculation.precioLitro,
            serviceType,
            nightFee: calculation.nightFee,
            fuelCost: calculation.fuelCost,
            total: calculation.total
        });

        let message = `*Cotización Asistencia Vial*\n`;
        if (name) message += `*Cliente:* ${name}\n`;
        if (vehicle) message += `*Vehículo:* ${vehicle}\n`;
        message += `*Servicio:* ${getServiceName(serviceType)}\n`;
        message += `*Distancia:* ${calculation.km} km\n`;
        message += `*Total:* ₡${calculation.total.toLocaleString("es-CR")}\n`;
        message += `\n_Desglose: ${document.getElementById("breakdown").textContent}_`;

        const url = `https://wa.me/?text=${encodeURIComponent(message)}`;
        window.open(url, "_blank");
    }

    // Inicializar al cargar la página
    renderHistory();
    calculate();
</script>

</body>
</html>
